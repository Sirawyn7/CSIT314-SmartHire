{% extends 'base.html' %}

{% block content %}
<title>Smart Hire Reset Password</title>

<div class="auth-card">
  <h2 class="auth-title">Reset password</h2>
  <p class="auth-subtitle">Enter your email address and we'll send you a link to reset your password</p>

  <form action="/api/auth/forgot-password" method="POST">

    <div class="auth-field">
      <label class="auth-label" for="Email">Email</label>
      <div class="auth-input-wrapper">
        <span class="auth-icon">✉</span>
        <input class="auth-input" type="email" id="Email" name="Email" placeholder="example@gmail.com">
      </div>
    </div>

    <button type="submit" class="auth-btn">Send reset link</button>

  </form>

  <p class="auth-footer">Remember your password? <a href="/login" class="auth-link">Back to login</a></p>
</div>

{% endblock %}
