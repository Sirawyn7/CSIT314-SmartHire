{% extends 'base.html' %}

{% block content %}
<title>Smart Hire Register</title>

<div class="auth-card">
  <h2 class="auth-title">Create an account</h2>
  <p class="auth-subtitle">Enter your information to create an account</p>

  <form action="/api/auth/register" method="POST">

    <div class="auth-field">
      <label class="auth-label" for="FullName">Full Name</label>
      <div class="auth-input-wrapper">
        <span class="auth-icon">👤</span>
        <input class="auth-input" type="text" id="FullName" name="FullName" placeholder="John Doe">
      </div>
    </div>

    <div class="auth-field">
      <label class="auth-label" for="Email">Email</label>
      <div class="auth-input-wrapper">
        <span class="auth-icon">✉</span>
        <input class="auth-input" type="email" id="Email" name="Email" placeholder="example@gmail.com">
      </div>
    </div>

    <div class="auth-field">
      <label class="auth-label" for="UserType">I am a...</label>
      <div class="auth-input-wrapper">
        <span class="auth-icon">💼</span>
        <select class="auth-input" id="UserType" name="UserType">
          <option value="" disabled selected>Select user type</option>
          <option value="job_seeker">Job Seeker</option>
          <option value="employer">Employer</option>
        </select>
      </div>
    </div>

    <div class="auth-field">
      <label class="auth-label" for="Password">Password</label>
      <div class="auth-input-wrapper">
        <span class="auth-icon">🔒</span>
        <input class="auth-input" type="password" id="Password" name="Password">
        <button type="button" class="auth-toggle" onclick="
          const i = document.getElementById('Password');
          i.type = i.type === 'password' ? 'text' : 'password';
        ">👁</button>
      </div>
    </div>

    <div class="auth-field">
      <label class="auth-label" for="ConfirmPassword">Confirm Password</label>
      <div class="auth-input-wrapper">
        <span class="auth-icon">🔒</span>
        <input class="auth-input" type="password" id="ConfirmPassword" name="ConfirmPassword">
        <button type="button" class="auth-toggle" onclick="
          const i = document.getElementById('ConfirmPassword');
          i.type = i.type === 'password' ? 'text' : 'password';
        ">👁</button>
      </div>
    </div>

    <button type="submit" class="auth-btn">Create account</button>

  </form>

  <p class="auth-footer">Already have an account? <a href="/login" class="auth-link">Log in</a></p>
</div>

{% endblock %}
