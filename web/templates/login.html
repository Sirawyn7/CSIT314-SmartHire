{% extends 'base.html' %}

{% block content %}
<title>Smart Hire Login</title>

<div class="auth-card">
  <h2 class="auth-title">Log in</h2>
  <p class="auth-subtitle">Enter your credentials to access your account</p>

  <form action="/api/auth/login" method="POST">

    <div class="auth-field">
      <label class="auth-label" for="Email">Email</label>
      <div class="auth-input-wrapper">
        <span class="auth-icon">✉</span>
        <input class="auth-input" type="email" id="Email" name="Email" placeholder="example@gmail.com">
      </div>
    </div>

    <div class="auth-field">
      <label class="auth-label" for="Password">Password</label>
      <div class="auth-input-wrapper">
        <span class="auth-icon">🔒</span>
        <input class="auth-input" type="password" id="Password" name="Password">
        <button type="button" class="auth-toggle" onclick="
          const i = document.getElementById('Password');
          i.type = i.type === 'password' ? 'text' : 'password';
        ">👁</button>
      </div>
    </div>

    <button type="submit" class="auth-btn">Log in</button>

  </form>

  <a href="/forgot-password" class="auth-link-muted">Forgot your password?</a>
  <p class="auth-footer">Don't have an account? <a href="/register" class="auth-link">Sign up</a></p>
</div>

{% endblock %}
