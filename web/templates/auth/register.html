{% extends 'base.html' %}

{% block content %}
<title>Smart Hire Register</title>

<div class="auth-card">
  <h2 class="auth-title">Create an account</h2>
  <p class="auth-subtitle">Enter your information to create an account</p>

  {% if error %}
    <p class="auth-error">{{ error }}</p>
  {% endif %}

  <div id="form-error" class="auth-error" style="display: none;"></div>

  <form action="{{ url_for('auth.register_post') }}" method="POST">

    <div class="auth-field">
      <label class="auth-label" for="email">Email</label>
      <div class="auth-input-wrapper">
        <span class="auth-icon">✉</span>
        <input class="auth-input" type="email" id="email" name="email" placeholder="example@gmail.com" required>
      </div>
    </div>

    <div class="auth-field">
      <label class="auth-label" for="user_type">I am a...</label>
      <div class="auth-input-wrapper">
        <span class="auth-icon">💼</span>
        <select class="auth-input" id="user_type" name="user_type" required>
          <option value="" disabled selected>Select user type</option>
          <option value="candidate">Job Seeker</option>
          <option value="employer">Employer</option>
        </select>
      </div>
    </div>

    <div class="auth-field">
      <label class="auth-label" for="password">Password</label>
      <div class="auth-input-wrapper">
        <span class="auth-icon">🔒</span>
        <input class="auth-input" type="password" id="password" name="password" required>
        <button type="button" class="auth-toggle" id="toggle-password">👁</button>
      </div>
    </div>

    <div class="auth-field">
      <label class="auth-label" for="confirm_password">Confirm Password</label>
      <div class="auth-input-wrapper">
        <span class="auth-icon">🔒</span>
        <input class="auth-input" type="password" id="confirm_password" name="confirm_password" required>
        <button type="button" class="auth-toggle" id="toggle-confirm-password">👁</button>
      </div>
    </div>

    <!-- Candidate fields -->
    <div id="candidate-fields" class="auth-user-type-fields" style="display: none;">

      <div class="auth-field">
        <label class="auth-label" for="full_name">Full Name</label>
        <div class="auth-input-wrapper">
          <span class="auth-icon">👤</span>
          <input class="auth-input" type="text" id="full_name" name="full_name" placeholder="John Doe">
        </div>
      </div>

      <div class="auth-field">
        <label class="auth-label" for="phone">Phone</label>
        <div class="auth-input-wrapper">
          <span class="auth-icon">📞</span>
          <input class="auth-input" type="text" id="phone" name="phone" placeholder="+61 400 000 000">
        </div>
      </div>

      <div class="auth-field">
        <label class="auth-label" for="education">Education Level</label>
        <div class="auth-input-wrapper">
          <span class="auth-icon">🎓</span>
          <select class="auth-input" id="education" name="education">
            <option value="" disabled selected>Select education level</option>
            <option value="High School">High School</option>
            <option value="Bachelor">Bachelor</option>
            <option value="Master">Master</option>
            <option value="PhD">PhD</option>
          </select>
        </div>
      </div>

      <div class="auth-field">
        <label class="auth-label" for="field_of_study">Field of Study</label>
        <div class="auth-input-wrapper">
          <span class="auth-icon">📚</span>
          <input class="auth-input" type="text" id="field_of_study" name="field_of_study" placeholder="Computer Science">
        </div>
      </div>

      <div class="auth-field">
        <label class="auth-label" for="years_experience">Years of Experience</label>
        <div class="auth-input-wrapper">
          <span class="auth-icon">📅</span>
          <input class="auth-input" type="number" id="years_experience" name="years_experience" placeholder="3" min="0">
        </div>
      </div>

      <div class="auth-field">
        <label class="auth-label" for="skills">Skills</label>
        <div class="auth-input-wrapper">
          <span class="auth-icon">🛠</span>
          <input class="auth-input" type="text" id="skills" name="skills" placeholder="Python, SQL, Flask">
        </div>
      </div>

      <div class="auth-field">
        <label class="auth-label" for="work_experience">Work Experience</label>
        <div class="auth-input-wrapper">
          <span class="auth-icon">🏢</span>
          <input class="auth-input" type="text" id="work_experience" name="work_experience" placeholder="Junior Developer at Acme Corp">
        </div>
      </div>

      <div class="auth-field">
        <label class="auth-label" for="preferred_work_mode">Preferred Work Mode</label>
        <div class="auth-input-wrapper">
          <span class="auth-icon">🖥</span>
          <select class="auth-input" id="preferred_work_mode" name="preferred_work_mode">
            <option value="" disabled selected>Select work mode</option>
            <option value="Remote">Remote</option>
            <option value="On-site">On-site</option>
            <option value="Hybrid">Hybrid</option>
          </select>
        </div>
      </div>

      <div class="auth-field">
        <label class="auth-label" for="preferred_location">Preferred Location</label>
        <div class="auth-input-wrapper">
          <span class="auth-icon">📍</span>
          <input class="auth-input" type="text" id="preferred_location" name="preferred_location" placeholder="Sydney, NSW">
        </div>
      </div>

    </div>

    <!-- Employer fields -->
    <div id="employer-fields" class="auth-user-type-fields" style="display: none;">

      <div class="auth-field">
        <label class="auth-label" for="company_name">Company Name</label>
        <div class="auth-input-wrapper">
          <span class="auth-icon">🏢</span>
          <input class="auth-input" type="text" id="company_name" name="company_name" placeholder="Acme Corp">
        </div>
      </div>

      <div class="auth-field">
        <label class="auth-label" for="company_description">Company Description</label>
        <div class="auth-input-wrapper">
          <span class="auth-icon">📝</span>
          <input class="auth-input" type="text" id="company_description" name="company_description" placeholder="We build great software">
        </div>
      </div>

      <div class="auth-field">
        <label class="auth-label" for="industry">Industry</label>
        <div class="auth-input-wrapper">
          <span class="auth-icon">🏭</span>
          <input class="auth-input" type="text" id="industry" name="industry" placeholder="Technology">
        </div>
      </div>

      <div class="auth-field">
        <label class="auth-label" for="location">Location</label>
        <div class="auth-input-wrapper">
          <span class="auth-icon">📍</span>
          <input class="auth-input" type="text" id="location" name="location" placeholder="Sydney, NSW">
        </div>
      </div>

      <div class="auth-field">
        <label class="auth-label" for="weburl">Website URL</label>
        <div class="auth-input-wrapper">
          <span class="auth-icon">🌐</span>
          <input class="auth-input" type="text" id="weburl" name="weburl" placeholder="https://acmecorp.com">
        </div>
      </div>

      <div class="auth-field">
        <label class="auth-label" for="contact_email">Contact Email</label>
        <div class="auth-input-wrapper">
          <span class="auth-icon">✉</span>
          <input class="auth-input" type="email" id="contact_email" name="contact_email" placeholder="contact@acmecorp.com">
        </div>
      </div>

    </div>

    <button type="submit" class="auth-btn">Create account</button>

  </form>

  <p class="auth-footer">Already have an account? <a href="{{ url_for('auth.login_page') }}" class="auth-link">Log in</a></p>
</div>

{% endblock %}
